
<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>မုန့်ဖိုး ၅ သိန်းပေးမှာလား 💗</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ffe4ec, #fce7ff, #e3f3ff);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      color: #743c59;
    }

    .card {
      width: min(90%, 420px);
      min-height: 410px;
      padding: 30px 20px;
      background: rgba(255, 255, 255, 0.88);
      border-radius: 28px;
      box-shadow: 0 12px 40px #d995b755;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .heart {
      font-size: 75px;
      margin: 12px 0;
      animation: beat 1s infinite;
    }

    h1 {
      font-size: 27px;
      line-height: 1.6;
    }

    .subtitle {
      color: #b17a98;
      font-size: 15px;
    }

    .button-area {
      height: 130px;
      position: relative;
      margin-top: 20px;
    }

    button {
      border: none;
      border-radius: 30px;
      padding: 13px 32px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 5px 12px #c58eaa44;
      touch-action: manipulation;
    }

    #yes {
      background: #ff6196;
      color: white;
      position: absolute;
      left: 12%;
      top: 20px;
    }

    #no {
      background: #eeeeee;
      color: #666;
      position: absolute;
      left: 57%;
      top: 20px;
    }

    .hidden {
      display: none !important;
    }

    #thankyou {
      padding-top: 45px;
    }

    #thankyou h1 {
      color: #ed4f8a;
      font-size: 27px;
    }

    .love-hearts {
      font-size: 28px;
      line-height: 1.8;
      animation: beat 1s infinite;
    }

    .small {
      font-size: 15px;
      color: #b17a98;
    }

    @keyframes beat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }

    .floating-heart {
      position: fixed;
      bottom: -40px;
      pointer-events: none;
      animation: floatUp 4s linear forwards;
      z-index: 5;
    }

    @keyframes floatUp {
      to {
        transform: translateY(-110vh) rotate(25deg);
        opacity: 0;
      }
    }
  </style>
</head>

<body>
  <main class="card">

    <!-- First screen -->
    <section id="question">
      <div class="heart">💗</div>

      <h1>မုန့်ဖိုး ၅ သိန်းပေးမှာလား?</h1>
      <p class="subtitle">စဉ်းစားပြီး ဖြေပေးနော် 🥺💕</p>

      <div class="button-area" id="buttonArea">
        <button id="yes">Yes 💖</button>
        <button id="no">No 🙈</button>
      </div>

      <p class="small">မှန်မှန်ဖြေပေးပါနော် 😝</p>
    </section>

    <!-- Second screen -->
    <section id="thankyou" class="hidden">
      <div class="heart">💖</div>
      <h1>ကျေးဇူးအများကြီးတင်ပါတယ် အာဘွား😚</h1>
      <div class="love-hearts">
        💕 💗 💖 💘 💝<br>
        💓 💞 💕 💗 💖
      </div>
      <p class="small">ချစ်စရာအကောင်းဆုံးပဲ 🥰</p>
    </section>

  </main>

  <script>
    const yesButton = document.getElementById("yes");
    const noButton = document.getElementById("no");
    const buttonArea = document.getElementById("buttonArea");
    const question = document.getElementById("question");
    const thankyou = document.getElementById("thankyou");

    // Make the No button escape to a random position
    function moveNoButton() {
      const maxX = buttonArea.clientWidth - noButton.offsetWidth;
      const maxY = buttonArea.clientHeight - noButton.offsetHeight;

      const x = Math.max(0, Math.random() * maxX);
      const y = Math.max(0, Math.random() * maxY);

      noButton.style.left = x + "px";
      noButton.style.top = y + "px";
    }

    // Move when the user tries to touch or click No
    noButton.addEventListener("pointerdown", function(event) {
      event.preventDefault();
      moveNoButton();
    });

    noButton.addEventListener("click", function(event) {
      event.preventDefault();
      moveNoButton();
    });

    // Yes opens the thank-you screen
    yesButton.addEventListener("click", function() {
      question.classList.add("hidden");
      thankyou.classList.remove("hidden");

      // Floating hearts
      for (let i = 0; i < 30; i++) {
        setTimeout(createHeart, i * 120);
      }
    });

    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "floating-heart";
      heart.textContent = ["💗", "💕", "💖", "💘", "💝"][
        Math.floor(Math.random() * 5)
      ];

      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = (18 + Math.random() * 22) + "px";
      heart.style.animationDuration = (3 + Math.random() * 3) + "s";

      document.body.appendChild(heart);

      setTimeout(() => heart.remove(), 6500);
    }
  </script>
</body>
</html>
